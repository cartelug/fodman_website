name: Lending V1 checks
on:
  push:
    paths: ['desk/**', 'supabase/**', 'tests/**', 'scripts/**', 'apply.js', 'package*.json']
  pull_request:
    paths: ['desk/**', 'supabase/**', 'tests/**', 'scripts/**', 'apply.js', 'package*.json']
permissions:
  contents: read
jobs:
  lending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:database
      - run: npm run test:edge
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
